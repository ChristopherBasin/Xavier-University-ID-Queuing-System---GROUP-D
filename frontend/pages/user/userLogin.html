<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>User Login</title>
  <link rel="stylesheet" href="../../css/user/userLogin.css" />
</head>
<body>

<div class="wrapper">
  <div class="card">

    <!-- LEFT -->
    <div class="left-panel">
      <img src="../../assets/xuLogo.svg" class="xu-logo" />
      <p class="school-name">
        Xavier University<br>
        <span>ATENEO DE CAGAYAN</span>
      </p>
    </div>

    <!-- RIGHT -->
    <div class="right-panel">
      <h2>ID RESERVATION</h2>

      <label>ID NUMBER</label>
      <input id="idNumber" placeholder="ENTER HERE" />

      <label>ID PASSWORD</label>
      <input id="password" type="password" placeholder="ENTER HERE" />

      <button id="loginBtn">PROCEED</button>
    </div>

  </div>
</div>

<script src="../../js/user/userLogin.js"></script>
</body>
</html>
