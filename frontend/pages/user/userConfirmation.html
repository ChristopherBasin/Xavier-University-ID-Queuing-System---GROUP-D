<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ID Confirmation</title>
  <link rel="stylesheet" href="../../css/user/userConfirmation.css">
</head>
<body>

<div class="wrapper">
  <div class="card">

    <div class="left-panel">
      <img src="../../assets/xuLogo.svg" class="xu-logo">
      <p>Xavier University<br>Ateneo de Cagayan</p>
    </div>

    <div class="right-panel">
      <h3>ID CONFIRMATION</h3>

      <div class="info-box" id="studentInfo">
        <!-- populated by JS -->
      </div>

      <div class="schedule">
        <label>Date</label>
        <input type="date" id="date">

        <label>Time</label>
        <input type="time" id="hour">
      </div>

      <button id="confirmBtn">CLICK TO CONFIRM</button>
    </div>

  </div>
</div>

<script src="../../js/user/userConfirmation.js"></script>
</body>
</html>
